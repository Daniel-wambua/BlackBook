name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit & integration tests
        run: pytest -q

      - name: Retrieval benchmark (eval)
        # The eval suite builds its own fixture corpus — fully offline.
        run: python -m blackbook.cli.main eval

      - name: Doctor (isolated home)
        # Doctor against a throwaway home so CI checks a fresh install, not
        # whatever may live in ~/.blackbook on the runner.
        env:
          BLACKBOOK_HOME: ${{ runner.temp }}/blackbook-home
        run: python -m blackbook.cli.main doctor
