# BlackBook MCP configuration.
# Place at ~/.blackbook/config.yaml, or point BLACKBOOK_CONFIG at it.
# Environment variables (BLACKBOOK_*) override these values.
#
# NOTE: quote source ids that look like hex (e.g. "0xdf") — YAML 1.1 otherwise
# parses `0xdf` as the integer 223.

home: ~/.blackbook

database:
  # Leave empty to use <home>/data.db
  path: ""

sources:
  - id: hacktricks
    name: HackTricks
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/HackTricks-wiki/hacktricks.git
    # max_files: 50            # optionally bound ingestion size
    # max_document_bytes: 209715200   # per-document cap (default 200 MB)

  - id: "0xdf"
    name: "0xdf"
    enabled: true
    type: website
    authority: trusted
    url: https://0xdf.gitlab.io/
    # max_files: 25

  - id: local_pdfs
    name: Local PDFs
    enabled: true
    type: filesystem
    authority: user            # user-supplied; NOT assumed authoritative
    directory: ~/knowledge/pdfs
    include_glob: "**/*.pdf"

  # GitHub sources are fetched as tarballs over HTTPS (no git/shell execution)
  # and are configuration-driven. Extra keys:
  #   ref           branch to track (default master)
  #   include_glob  which files to index (default **/*.md)
  #   content_root  restrict indexing to a repo subtree
  #   site_url      map citations to the published site instead of a GitHub
  #                 blob URL
  - id: payloads
    name: PayloadsAllTheThings
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/swisskyrepo/PayloadsAllTheThings.git
    ref: master

  - id: hacker_recipes
    name: The Hacker Recipes
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/The-Hacker-Recipes/The-Hacker-Recipes.git
    ref: main
    content_root: docs
    site_url: https://thehacker.recipes

  - id: gtfobins
    name: GTFOBins
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/GTFOBins/GTFOBins.github.io.git
    ref: master
    content_root: _gtfobins
    site_url: https://gtfobins.github.io

  - id: lolbas
    name: LOLBAS
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/LOLBAS-Project/LOLBAS.git
    ref: master
    site_url: https://lolbas-project.github.io

  # macOS binaries ("Living Off the Orchard"); YAML corpus.
  - id: loobins
    name: LOOBins
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/infosecB/LOOBins.git
    ref: main
    content_root: LOOBins
    site_url: https://loobins.io

  # Offensive Windows/AD command cheat sheets; content lives in front matter.
  - id: wadcoms
    name: WADComs
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/WADComs/WADComs.github.io.git
    ref: master
    content_root: _wadcoms
    site_url: https://wadcoms.github.io

  # AD / internal-network pentest cheat sheets (swisskyrepo, MkDocs).
  # Pure-configuration source: resolves to the generic GitHub-markdown
  # adapter via the git-type fallback.
  - id: internal_all_the_things
    name: Internal All The Things
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/swisskyrepo/InternalAllTheThings.git
    ref: main
    content_root: docs
    site_url: https://swisskyrepo.github.io/InternalAllTheThings

  # Moamen Basel's HTB writeups (Jekyll). Pages carry Jekyll permalinks,
  # which become the citation URLs; exclude_glob drops the 0xdf/IppSec link
  # indexes (duplicating other sources) and repo plumbing.
  - id: htb_writeups
    name: HTB Writeups (Moamen Basel)
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/momenbasel/htb-writeups.git
    ref: main
    site_url: https://www.moamenbasel.com/htb-writeups
    exclude_glob: >-
      templates/**, 0xdf-htb-machines.md, ippsec-video-index.md,
      CONTRIBUTING.md, README.md

  - id: owasp_wstg
    name: OWASP Web Security Testing Guide
    enabled: true
    type: git
    authority: official
    url: https://github.com/OWASP/wstg.git
    ref: master
    content_root: document

  - id: owasp_asvs
    name: OWASP ASVS
    enabled: true
    type: git
    authority: official
    url: https://github.com/OWASP/ASVS.git
    ref: master

  - id: owasp_api_security
    name: OWASP API Security Top 10
    enabled: true
    type: git
    authority: official
    url: https://github.com/OWASP/API-Security.git
    ref: master

  - id: bugbounty_cheatsheet
    name: Bug Bounty Cheatsheet
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/EdOverflow/bugbounty-cheatsheet.git
    ref: master

  - id: portswigger
    name: PortSwigger Web Security Academy
    enabled: true
    type: website
    authority: trusted
    url: https://portswigger.net/web-security
    path_prefix: /web-security
    max_files: 500

  - id: google_bug_hunters
    name: Google Bug Hunters
    enabled: true
    type: rss
    authority: trusted
    url: https://bughunters.google.com/learn
    feed_url: https://bughunters.google.com/feed/en
    max_files: 100

  - id: bugcrowd_vrt
    name: Bugcrowd Vulnerability Rating Taxonomy
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/bugcrowd/vulnerability-rating-taxonomy.git
    ref: master

  - id: github_security_lab
    name: GitHub Security Lab Research
    enabled: true
    type: rss
    authority: trusted
    url: https://github.blog/tag/github-security-lab/
    feed_url: https://github.blog/tag/github-security-lab/feed/
    max_files: 100

  # Public HackerOne educational material and disclosed-report archives.
  # Report archives have no declared repository license; review provenance and
  # redistribution terms before using them outside your local knowledge base.
  - id: hacker101
    name: Hacker101 (HackerOne)
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/Hacker0x01/hacker101.git
    ref: master
    categories: [bug-bounty, hackerone, education]

  - id: hackerone_reports_index
    name: HackerOne Reports Index
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/reddelexc/hackerone-reports.git
    ref: master
    categories: [bug-bounty, hackerone, report-index]

  - id: hackerone_disclosed_reports
    name: HackerOne Disclosed Reports
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/ajaysenr/HackerOne-Disclosed-Reports.git
    ref: main
    content_root: reports
    categories: [bug-bounty, hackerone, disclosed-report]

  - id: hackerone_reports_metadata
    name: HackerOne Reports Metadata
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/aldaor/HackerOneReports.git
    ref: master
    include_glob: "**/*.txt"
    categories: [bug-bounty, hackerone, report-metadata]

  - id: hackerone_bug_bounty_reports
    name: HackerOne Bug Bounty Reports
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/codebygk/hackerone-bug-bounty-reports.git
    ref: master
    categories: [bug-bounty, hackerone, report-index]

  - id: webhacklist
    name: WebHackList
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/irsdl/webhacklist.git
    ref: master
    include_glob: "**/*.md"
    site_url: https://webhacklist.com
    deduplicate_chunks: true
    categories: [web-security, research, webhacklist]

  # Public HackerOne educational material and disclosed-report archives.
  # Report archives have no declared repository license; review provenance and
  # redistribution terms before using them outside your local knowledge base.
  - id: hacker101
    name: Hacker101 (HackerOne)
    enabled: true
    type: git
    authority: trusted
    url: https://github.com/Hacker0x01/hacker101.git
    ref: main
    include_glob: "**/*.md"
    categories: [bug-bounty, hackerone, education]

  - id: hackerone_reports_index
    name: HackerOne Reports Index
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/reddelexc/hackerone-reports.git
    ref: master
    include_glob: "**/*.md"
    categories: [bug-bounty, hackerone, report-index]

  - id: hackerone_disclosed_reports
    name: HackerOne Disclosed Reports
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/ajaysenr/HackerOne-Disclosed-Reports.git
    ref: main
    include_glob: "**/*.md"
    content_root: reports
    categories: [bug-bounty, hackerone, disclosed-report]

  - id: hackerone_reports_metadata
    name: HackerOne Reports Metadata
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/aldaor/HackerOneReports.git
    ref: main
    include_glob: "**/*.txt"
    categories: [bug-bounty, hackerone, report-metadata]

  - id: hackerone_bug_bounty_reports
    name: HackerOne Bug Bounty Reports
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/codebygk/hackerone-bug-bounty-reports.git
    ref: main
    include_glob: "**/*.md"
    categories: [bug-bounty, hackerone, report-index]

  # MITRE ATT&CK enterprise STIX bundle (official; ~54 MB download).
  # Ingesting it lets knowledge_technique return official tactics, platforms,
  # and an attack.mitre.org link alongside the cited corpus references.
  - id: attack
    name: MITRE ATT&CK
    enabled: true
    type: git
    authority: official
    url: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json

  # Community-authored pentest material published without a declared license.
  # Same posture as the report archives above: indexed locally for research use
  # and marked "unknown" authority so it never outranks curated sources.
  # Promote an entry to "trusted" once its provenance and redistribution terms
  # have been reviewed.

  # Hugo blog. Only /blog/* is content (the sitemap's ~930 /services/* pages are
  # marketing noise), and the url must carry the prefix itself or the crawl has
  # no valid entry point.
  - id: highon_coffee
    name: High on Coffee
    enabled: true
    type: website
    authority: unknown
    url: https://highon.coffee/blog
    path_prefix: /blog
    max_files: 80
    categories: [pentest, blog]

  # GitBook spaces. Their page bodies are client-rendered, so a generic website
  # crawl would index only sidebar chrome. type: gitbook reads the space's
  # llms.txt index and each page's markdown instead, which also yields the
  # published slugs (and so citation links that resolve).
  - id: martian1337_notes
    name: Martian Defense Notebook
    enabled: true
    type: gitbook
    authority: unknown
    url: https://martian1337.gitbook.io/notes
    categories: [notes, training]

  # Read from the published book rather than the six2dez/pentest-book repo:
  # GitBook's slugs differ from the repo's file paths, so mapping repo paths
  # onto the site produces dead citation links.
  - id: pentest_book
    name: Pentest Book (six2dez)
    enabled: true
    type: gitbook
    authority: unknown
    url: https://www.pentest-book.com
    categories: [pentest, methodology]

  # Astro blog; the pyjail cheatsheet lives here. Only the blog content
  # collection is ingested, and site_url maps each post to its page.
  - id: shirajuki_blog
    name: Shirajuki Notes
    enabled: true
    type: git
    authority: unknown
    url: https://github.com/Shirajuki/shirajuki.github.io.git
    ref: master
    content_root: src/content/blog
    site_url: https://shirajuki.js.org/blog
    categories: [python, exploitation]

  # Single-page GitHub Pages guide; its whole text is in index.html.
  - id: arcanum_devops
    name: DevOps Attack Surface (Arcanum Sec)
    enabled: true
    type: website
    authority: unknown
    url: https://arcanum-sec.github.io/devops-attack-surface/
    path_prefix: /devops-attack-surface
    max_files: 10
    categories: [cloud, devops, attack-surface]

  # Name-indexed reference dump: one HTML index listing every item, one small
  # page per item. This site publishes no sitemap, feed or robots.txt, so the
  # index is the only discovery path — a generic crawl bounded by max_files
  # would capture an alphabetical slice and stop, silently. include_prefixes
  # selects the interesting entries (~7.6k of 24.3k) *before* the cap. The
  # pages are decompiled Microsoft kernel code with no declared license, hence
  # authority: unknown; citation links can rot if the server disappears.
  - id: nt_functions
    name: Windows NT Kernel Functions (likeagod)
    enabled: true
    type: function_index
    authority: unknown
    url: https://likeagod.revers.engineering/nt/
    include_prefixes: [Nt, Zw, Rtl, Io, Mm, Ob, Ps, Se, Cm, Ki]
    max_files: 8000
    categories: [windows, kernel, reverse-engineering, nt-internals]

embeddings:
  enabled: false               # Phase 3: semantic/vector search
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu

retrieval:
  default_limit: 8
  max_limit: 50
  max_context_chunks: 12
  per_document_cap: 2          # source diversity: max chunks per document
  # Diversity across sources. HackTricks alone is over a thousand documents,
  # so without this a query it covers heavily can return eight HackTricks
  # chunks and nothing else while the writeup repos, the cheatsheets and the
  # local pdfs hold comparable evidence. This is a preference, not a quota: a
  # result the cap sets aside is used to fill any slot the diverse hits did not
  # take, so the cap never makes a result list shorter than you asked for. Set
  # to 0 to disable.
  per_source_cap: 4
  snippet_chars: 400

logging:
  level: INFO

query_log:
  # Record every search locally: phrasing, mode, sources, hit count, best
  # score, latency. Read it with `blackbook queries`, which is most useful
  # with --empty (the phrasings that returned nothing). Local to the SQLite
  # file, never transmitted. Set enabled: false to record nothing at all.
  enabled: true
  # Newest entries kept; older ones are pruned on insert, so the log stays a
  # bounded recent-history record rather than growing for the life of the
  # install.
  max_entries: 5000

server:
  # HTTP transport settings (only used by `blackbook serve --http`; stdio
  # ignores all of these).
  host: 127.0.0.1
  port: 8890
  path: /mcp
  # Optional bearer token. When set, every HTTP request must carry
  #   Authorization: Bearer <token>
  # or it is rejected with 401. Strongly recommended for any non-loopback bind.
  auth_token: ""
  # Refuse to start on a non-loopback address unless auth_token is set.
  # Flip to false only if you understand the exposure.
  require_auth_off_loopback: true
