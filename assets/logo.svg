<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-label="BlackBook MCP — source-grounded cybersecurity knowledge and research MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#0e1526"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#3a9bf0"/>
      <stop offset="0.70" stop-color="#6b6bec"/>
      <stop offset="1" stop-color="#8f5be8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8f5be8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1.5" y="1.5" width="1057" height="297" rx="24" fill="url(#bg)" stroke="#1b2740" stroke-width="2"/>

  <!-- terminal tile emblem with a >_ prompt -->
  <rect x="56" y="90" width="120" height="120" rx="22" fill="#0a0e17" stroke="url(#brand)" stroke-width="3"/>
  <polyline points="96,126 122,150 96,174" fill="none" stroke="url(#brand)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="130" y="166" width="36" height="11" rx="5" fill="url(#brand)"/>

  <!-- wordmark -->
  <text x="212" y="158" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="76" font-weight="800" letter-spacing="1.5" fill="url(#brand)">BLACKBOOK</text>

  <!-- accent rule under the wordmark -->
  <rect x="214" y="178" width="640" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- tagline -->
  <text x="214" y="214" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#cdd6e4">Source-grounded cybersecurity knowledge &amp; research MCP</text>

  <!-- meta line -->
  <text x="214" y="250" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#64748b"><tspan fill="#22d3ee" font-weight="600">v0.6.0</tspan>  ·  read-only  ·  no execution  ·  every claim cited</text>
</svg>
