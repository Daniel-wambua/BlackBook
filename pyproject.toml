[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbook-mcp"
version = "0.6.0"
description = "BlackBook MCP — a source-grounded cybersecurity knowledge & research MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "BlackBook MCP" },
]
keywords = ["mcp", "cybersecurity", "knowledge", "retrieval", "research", "pentest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Indexing",
]

# Core runtime dependencies. These are deliberately lean: the entire lexical
# retrieval backbone is stdlib sqlite3 (FTS5 + JSON1), so no heavy DB clients.
dependencies = [
    "mcp>=1.2.0,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "ruamel.yaml>=0.18,<0.19",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "markdown-it-py>=3.0,<4.0",
    "pypdf>=4.0,<7.0",
    "httpx>=0.27,<0.29",
    "typer>=0.12,<1.0",
    "rich>=13.7,<16.0",
]

[project.optional-dependencies]
# Semantic / embedding layer (Phase 3). Optional: install with
#   pip install "blackbook-mcp[semantic]"
semantic = [
    "numpy>=1.26,<3.0",
    "sentence-transformers>=2.7,<5.0",
]
# Development / test extras.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<6.0",
]

[project.scripts]
blackbook = "blackbook.cli.main:app"
# Alias matching the early design sketch; both point at the same Typer app.
cyber-knowledge = "blackbook.cli.main:app"

[project.urls]
Homepage = "https://github.com/Daniel-wambua/BlackBook"
Documentation = "https://github.com/Daniel-wambua/BlackBook#readme"
Source = "https://github.com/Daniel-wambua/BlackBook"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbook"]

[tool.hatch.build.targets.sdist]
include = ["src/blackbook", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.package-data]
blackbook = ["py.typed"]
